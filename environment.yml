name: mlops-kickoff-2
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - pandas
  - numpy
  - scikit-learn
  - joblib
  - matplotlib
  - seaborn
  - shap
  - lime
  - jupyter
  - ipykernel
  - pytest
  - pytest-cov
  - pip
  - pyyaml

  - pip:
    - fastapi
    - uvicorn[standard]
    - wandb

platforms:
  - linux-64
  - osx-arm64
  - win-64
  - linux-aarch64