name: Deploy

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install fastapi uvicorn[standard] wandb
      - name: Run tests
        run: python -m pytest -q
      - name: Build Docker image
        run: |
          docker build -t iris-mloaps:latest .
      - name: Display deployment note
        run: echo "Deploy this container to Render/Heroku/GCP/AWS with your service account and access token."
