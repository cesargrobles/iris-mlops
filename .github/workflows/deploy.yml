name: Deploy

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install fastapi uvicorn[standard] wandb

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: |
          docker build -t iris-mlops:latest .

      - name: Deploy to Render
        if: github.event_name == 'release' && github.event.action == 'published'
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_URL secret not configured"
            echo "To enable automatic Render deployment:"
            echo "1. Go to Render dashboard → Select the iris-mlops service"
            echo "2. Settings → Deploy Hook → Copy the webhook URL"
            echo "3. GitHub repo → Settings → Secrets and variables → Actions"
            echo "4. Add new secret: RENDER_DEPLOY_HOOK_URL = [webhook URL]"
          else
            echo "Triggering Render deployment..."
            curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "✅ Render deployment triggered"
          fi

      - name: Deployment summary
        run: |
          echo "✅ Tests passed"
          echo "✅ Docker image built: iris-mlops:latest"
          echo "📦 Ready for deployment"
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "🚀 Release: ${{ github.event.release.tag_name }}"
          fi
