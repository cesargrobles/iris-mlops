# Example configuration for the Iris MLOps pipeline

data:
  raw: "data/raw/iris.csv"
  processed: "data/processed/clean.csv"
  reports: "reports/predictions.csv"
  models: "models/model.joblib"

pipeline:
  target_column: "species"
  problem_type: "classification"

  features:
    quantile_bin: ["sepal_length", "sepal_width", "petal_length", "petal_width"]
    categorical_onehot: []
    numeric_passthrough: []
    binary_sum_cols: []
    n_bins: 3

split:
  test_size: 0.10
  val_size: 0.20
  random_state: 42
  stratify: true

validation:
  check_missing_values: false
  numeric_non_negative_cols:
    - sepal_length
    - sepal_width
    - petal_length
    - petal_width
  target_allowed_values:
    - setosa
    - versicolor
    - virginica

training:
  model_type: "LogisticRegression"
  logistic_regression:
    max_iter: 500
    solver: "lbfgs"
    class_weight: "balanced"
  random_forest:
    n_estimators: 100
    max_depth: 7

logging:
  level: "INFO"
  file: "logs/app.log"

wandb:
  enabled: false
  project: "iris-mloaps"
  entity: ""
  tags: []

api:
  host: "0.0.0.0"
  port: 8080
  model_path: "models/model.joblib"
